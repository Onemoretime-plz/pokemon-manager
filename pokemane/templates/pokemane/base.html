{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ポケマネ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'pokemane/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="auth-nav">
            {% if request.user.is_authenticated %}
                <span class="login-user-label">
                    {{ request.user.username }}
                </span>

                <form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="secondary-button small-button">
                        ログアウト
                    </button>
                </form>
            {% else %}
                <a class="secondary-button small-button" href="{% url 'accounts:login' %}">
                    ログイン
                </a>
                <a class="primary-button small-button" href="{% url 'accounts:signup' %}">
                    新規登録
                </a>
            {% endif %}
        </div>
        <div class="site-title">ポケマネ</div>
        <nav class="site-nav">
            <a href="{% url 'pokemane:pokemon_list' %}">実装ポケモン</a>
            <a href="{% url 'pokemane:set_list' %}">型一覧</a>
            <a href="{% url 'pokemane:party_list' %}">パーティー</a>
            <a href="#">ダメージ計算</a>
            <a href="/admin/">管理画面</a>
        </nav>
    </header>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

{% block scripts %}{% endblock %}
</body>
</html>
